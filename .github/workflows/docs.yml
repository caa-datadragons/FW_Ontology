# Builds the web documentation of the ontology (pyLODE) and publishes it on GitHub Pages.
#
# One-off setting: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Result: https://caa-datadragons.github.io/FW_Ontology/ (index.html, ontology.ttl, .rdf, .jsonld)
name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "ontology/**"
      - "py/build_docs.py"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "ontology/**"
      - "py/build_docs.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      # Fails on an ontology that pyLODE cannot document (see the docstring of the script).
      - run: python py/build_docs.py
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    # A pull request only checks that the build works; nothing is published.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
